name: Legacy source recovery validation
on:
  push:
    branches: [restore/original-sources-20261126]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate recovered source identity and safety invariants
        run: |
          python3 tool/verify_recovery_safety.py
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/com/example')
          files=list(root.rglob('*.kt'))
          assert len(files)==54, len(files)
          assert Path('SOURCE_IMPORT_PROVENANCE.md').is_file()
          assert not Path('google-services.json').exists()
          assert not Path('.env').exists()
          print(f'PASS: {len(files)} recovered main Kotlin files')
          PY
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure SDK (Android 36.1)
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build and test original CashMate
        run: gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Attach unverified debug APK even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CashMate-original-debug-REQUIRES-DEVICE-QA
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
