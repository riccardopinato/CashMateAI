name: Legacy source recovery validation
on:
  push:
    branches: [restore/original-sources-20261126]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate recovered source identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('app/src/main/java/com/example')
          files = list(root.rglob('*.kt'))
          assert len(files) >= 55, len(files)
          gradle = Path('app/build.gradle.kts').read_text()
          assert 'com.aistudio.cashmate.aqzwlx' in gradle
          assert Path('app/src/main/java/com/example/data/local/AppDatabase.kt').exists()
          assert Path('SOURCE_IMPORT_PROVENANCE.md').exists()
          assert not Path('google-services.json').exists()
          assert not Path('.env').exists()
          for f in Path('.').rglob('*'):
              if f.is_file() and f.suffix in {'.kt','.md','.kts'}:
                  assert 'riccardo121296@gmail.com' not in f.read_text(errors='replace'), f
          print(f"Recovered Kotlin sources: {len(files)}")
          PY
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure SDK (Android 36.1)
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Tests and debug APK (no secrets)
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Attach debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CashMate-original-debug-UNVERIFIED
          path: app/build/outputs/apk/debug/*.apk
